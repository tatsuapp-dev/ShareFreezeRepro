name: ShareFreezeRepro
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
targets:
  ShareFreezeRepro:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShareFreezeRepro
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Info.plist
